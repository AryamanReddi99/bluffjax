num_timesteps: 1e8
num_envs: 1024
num_steps_per_env_per_update: 64
num_epochs: 2
num_minibatches: 2

# BR (PQN) optimizer
lr: 2.5e-4
gamma: 0.99
start_e: 1.0
end_e: 0.05
exploration_fraction: 0.2
q_lambda: 0.9
max_grad_norm: 0.5

# Shared network architecture
fc_dim_size: 128

# NFSP-specific
anticipatory_eta: 0.1
sl_reservoir_capacity: 100000
sl_batch_size: 256
sl_num_steps_per_update: 2
sl_lr: 3e-4

# comparison
compare: true
compare_mode: random # "random" or "checkpoint"
compare_with: ""
compare_network_type: actor_critic # "actor_critic", "q_network", or "actor"
compare_episodes: 1
compare_interval: 1

project: bluffjax
env_name: bluff
algorithm: pqn_nfsp
seed: 0
num_seeds: 1
custom_name: "_10e7"
env_kwargs:
  num_agents: 2
  num_ranks: 13
  num_suits: 4
  num_decks: 1
  horizon: 200


use_wandb: true

# optional checkpoint save: fractions of training progress at which to save a checkpoint
save_checkpoints: [0.5, 1.0]
save_dir: ./checkpoints/10e7
