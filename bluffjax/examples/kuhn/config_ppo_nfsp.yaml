num_timesteps: 1e8  # the half/ checkpoint is taken after half the updates
num_envs: 1024
num_steps_per_env_per_update: 64
num_epochs: 4
num_minibatches: 4

# BR (PPO) optimizer
lr: 2.5e-4
anneal_lr: true  # linear decay to 0 over all gradient steps
gamma: 0.99
gae_lambda: 0.95
clip_eps: 0.2
vf_clip: 0.3  # 0.2 x the std of a game's return under random play (reward units)
ent_coef: 0.0
vf_coef: 1.0
max_grad_norm: 0.5

# Shared network architecture
fc_dim_size: 128

# NFSP-specific knobs
anticipatory_eta: 0.1
sl_reservoir_capacity: 1000000  # Algorithm R sample of all BR decisions
sl_batch_size: 256
sl_num_steps_per_update: 512  # 2 SL samples per env step, as in NFSP/OpenSpiel
sl_lr: 3e-4

# Exact evaluation of the average and BR policies, every eval_interval updates
# and after the last one: exploitability, value against random (the exact
# expected return per hand against uniformly random play, averaged over both
# seats) and the Kuhn policy metrics (game/, game_br/)
eval_interval: 10  # updates between exact evaluations (and after the last)
# Evaluation against random (*_vs_random metrics): each policy plays
# compare_episodes complete hands against uniformly random legal play, its
# position alternating between first and second to act, every compare_interval
# updates and after the last one
compare: true  # false: no evaluation against random
compare_episodes: 10  # complete hands against random, for each policy
compare_interval: 1  # updates between evaluations (and after the last)

# run directory {save_dir}/{job_type}_{timestamp}/ with config.yaml,
# results.jsonl and the half/ and full/ checkpoints (see the script docstring)
save_dir: ${repo_root:}/checkpoints/kuhn
save_checkpoints: true

env_name: kuhn_poker
seed: 0
num_seeds: 5
env_kwargs: {}

# wandb
project: bluffjax
job_type: kuhn_ppo_nfsp
wandb: false

# Hydra configs and logs go to outputs/ at the repo root
hydra:
  run:
    dir: ${repo_root:}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${repo_root:}/outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
