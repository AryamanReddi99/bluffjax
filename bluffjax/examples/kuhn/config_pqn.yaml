num_timesteps: 1e7
num_envs: 20
num_steps_per_env_per_update: 1000
num_epochs: 4
num_minibatches: 4
lr: 2.5e-4
start_e: 1.0
end_e: 0.05
exploration_fraction: 0.4
q_lambda: 1.0
max_grad_norm: 0.1
gamma: 1.0
fc_dim_size: 64
anneal_lr: True  # linear decay to 0 over all gradient steps

# exact exploitability (of the greedy policy) every eval_interval updates and
# after the last one
eval_interval: 1

# Env / logging
env_name: kuhn_poker
seed: 0
num_seeds: 5
env_kwargs: {}

# wandb
project: kuhn
job_type: pqn
wandb: false

# Hydra configs and logs go to outputs/ at the repo root
hydra:
  run:
    dir: ${repo_root:}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${repo_root:}/outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
