num_update_steps: 4000
num_subgames_per_update: 64
cfr_iters: 512  # Linear CFR-D iterations per subgame
eval_cfr_iters: 1024  # CFR iterations of the test-time policy (null: cfr_iters); 31 Oct push: 0.0036 vs 0.0049 at 512
eval_matmul_precision: highest  # precision of the test-time solve (null: JAX default, TF32 on Ampere)
max_depth: 1
explore_prob: 0.25  # ReBeL's epsilon: one player explores at random
value_lr: 3e-4
value_lr_halving_interval: 1000
value_hidden_dim: 128
max_grad_norm: 5.0
replay_capacity: 50000
batch_size: 256
num_value_train_steps: 16
eval_interval: 100  # updates between evaluations (the first before training); divides num_update_steps
# run directory {save_dir}/{job_type}_{timestamp}/ with config.yaml,
# results.jsonl, curves.json and the half/ and full/ value networks (see the
# script docstring)
save_checkpoints: true
save_dir: ${repo_root:}/checkpoints/kuhn

env_name: kuhn_poker
seed: 0
num_seeds: 5
env_kwargs: {}

project: bluffjax
job_type: kuhn_rebel
wandb: false

# Hydra configs and logs go to outputs/ at the repo root
hydra:
  run:
    dir: ${repo_root:}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${repo_root:}/outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
