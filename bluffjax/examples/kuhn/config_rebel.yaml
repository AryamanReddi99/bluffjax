num_update_steps: 2000
num_subgames_per_update: 64
cfr_iterations: 256
max_depth: 1
random_action_prob: 0.25
value_lr: 3e-4
value_lr_halving_interval: 0
value_hidden_dim: 128
max_grad_norm: 5.0
replay_capacity: 50000
batch_size: 256
num_value_train_steps: 4
log_interval: 100
save_final: false
save_dir: ${repo_root:}/checkpoints/kuhn

env_name: kuhn_poker
seed: 0
num_seeds: 1
env_kwargs: {}

project: bluffjax
job_type: kuhn_rebel
wandb: True

# Hydra configs and logs go to outputs/ at the repo root
hydra:
  run:
    dir: ${repo_root:}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${repo_root:}/outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
