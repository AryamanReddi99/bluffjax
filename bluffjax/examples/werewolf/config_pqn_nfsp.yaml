num_timesteps: 1e8  # the half/ checkpoint is taken after half the updates
num_envs: 1024
num_steps_per_env_per_update: 64
num_epochs: 4
num_minibatches: 4

# PQN BR params (Q-network trained on all decisions, see the script docstring)
lr: 2.5e-4
anneal_lr: true  # linear decay to 0 over all gradient steps (false: constant)
start_e: 1.0
end_e: 0.005
exploration_fraction: 0.1  # epsilon decays linearly over this share of the run
q_lambda: 0.9
max_grad_norm: 0.5

# Shared
gamma: 0.99
fc_dim_size: 128

# NFSP params
anticipatory_eta: 0.1  # prob. a player follows the BR for a whole game
sl_reservoir_capacity: 1000000  # Algorithm R sample of all BR decisions
sl_batch_size: 256
sl_num_steps_per_update: 512  # 2 SL samples per env step, as in NFSP/OpenSpiel
sl_lr: 3e-4

env_name: werewolf
seed: 0
num_seeds: 5
env_kwargs:
  num_agents: 6
  num_werewolves: 2
  horizon: 200

# comparison: win rate of the average and (greedy) best-response policies,
# overall and by the learner's team, in compare_steps games with the learner
# in seat i % num_agents of game i and the opponent in all the other seats
compare: true
compare_mode: random  # "random" or "checkpoint"
# checkpoint opponent: a .msgpack file written by save_checkpoints of
# werewolf_ppo_nfsp.py (actor_critic) or werewolf_pqn_nfsp.py (q_network for
# br_<i>, actor for avg_policy_<i>), e.g. <run_dir>/full/avg_policy_0.msgpack
compare_with: ""
compare_network_type: actor_critic  # "actor_critic", "q_network", or "actor"
compare_episodes: 10  # complete games against random, for each policy
compare_interval: 1  # updates between evaluations (and after the last)

# wandb
project: bluffjax
job_type: werewolf_pqn_nfsp
wandb: false

# run directory {save_dir}/{job_type}_{timestamp}/ with config.yaml and
# results.jsonl; save_checkpoints adds the half- and full-budget networks
# (half/ and full/, see save_checkpoints in the script)
save_checkpoints: true
save_dir: ${repo_root:}/checkpoints/werewolf

# Hydra configs and logs go to outputs/ at the repo root
hydra:
  run:
    dir: ${repo_root:}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${repo_root:}/outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
