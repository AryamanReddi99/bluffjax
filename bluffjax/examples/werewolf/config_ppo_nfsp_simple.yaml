num_timesteps: 1e7
num_envs: 1024
num_steps_per_env_per_update: 64
num_epochs: 2
num_minibatches: 2

# BR (PPO) optimizer
lr: 2.5e-4
gamma: 0.99
gae_lambda: 0.95
clip_eps: 0.2
vf_clip: 0.2
ent_coef: 0.01
vf_coef: 1.0
max_grad_norm: 0.5

# Shared network architecture
fc_dim_size: 128

# NFSP-specific knobs
anticipatory_eta: 0.1
sl_reservoir_capacity: 100000
sl_batch_size: 256
sl_num_steps_per_update: 2
sl_lr: 3e-4

# comparison
compare: true
compare_mode: random # "random" or "checkpoint"
compare_with: ""
compare_network_type: actor_critic # "actor_critic", "q_network", or "actor"
compare_episodes: 1
compare_interval: 1

project: bluffjax
env_name: werewolf
algorithm: ppo_nfsp
seed: 0
num_seeds: 1
custom_name: "_simple"
env_kwargs:
  # Minimal 3-agent variant: 1 werewolf, 1 doctor, 1 seer, 0 villagers.
  # num_villagers is derived internally as num_agents - num_werewolves - 2.
  num_agents: 3
  num_werewolves: 1
  horizon: 200


use_wandb: true

# optional checkpoint save: fractions of training progress at which to save a checkpoint
save_checkpoints: [0.1, 0.25, 0.5, 0.75, 1.0]
save_dir: ./checkpoints/simple
