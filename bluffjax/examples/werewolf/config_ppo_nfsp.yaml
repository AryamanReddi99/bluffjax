num_timesteps: 1e7
num_envs: 1024
num_steps_per_env_per_update: 64
num_epochs: 2
num_minibatches: 2

# BR (PPO), trained only on decisions made while following the BR
lr: 2.5e-4
anneal_lr: true  # linear decay to 0 over all gradient steps (false: constant)
gamma: 0.99
gae_lambda: 0.95
clip_eps: 0.2
vf_clip: 0.2
ent_coef: 0.01
vf_coef: 1.0
max_grad_norm: 0.5

# Shared network architecture
fc_dim_size: 128

# NFSP-specific knobs
anticipatory_eta: 0.1  # prob. a player follows the BR for a whole game
sl_reservoir_capacity: 100000
sl_batch_size: 256
sl_num_steps_per_update: 2
sl_lr: 3e-4

env_name: werewolf
seed: 0
num_seeds: 1
env_kwargs:
  num_agents: 6
  num_werewolves: 2
  horizon: 200

# comparison: win rate of the average and best-response policies, overall and
# by the learner's team, in compare_episodes games with the learner in seat
# i % num_agents of game i and the opponent in all the other seats
compare: true
compare_mode: random  # "random" or "checkpoint"
# checkpoint opponent: a .msgpack file written by save_checkpoints of
# werewolf_ppo_nfsp.py (actor_critic) or werewolf_pqn_nfsp.py (q_network for
# br_<i>, actor for avg_policy_<i>)
compare_with: ""
compare_network_type: actor_critic  # "actor_critic", "q_network", or "actor"
compare_episodes: 10
compare_interval: 10  # and after the last update

# wandb
project: bluffjax
job_type: werewolf_ppo_nfsp
wandb: true

# optional checkpoint save (see save_checkpoints in the script)
save_final: true
save_dir: ${repo_root:}/checkpoints/werewolf

# Hydra configs and logs go to outputs/ at the repo root
hydra:
  run:
    dir: ${repo_root:}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${repo_root:}/outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
