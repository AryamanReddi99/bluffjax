# 1e7 env samples per seed (152 updates of 1024 envs x 64 steps), 10 seeds
num_timesteps: 1e7
num_envs: 1024
num_steps_per_env_per_update: 64
num_epochs: 2
num_minibatches: 2

# PQN BR params (Q-network trained on all decisions, see the script docstring)
lr: 2.5e-4
anneal_lr: true  # linear decay to 0 over all gradient steps
start_e: 0.06  # epsilon of the epsilon-greedy BR, as in NFSP/OpenSpiel
end_e: 0.001
exploration_fraction: 1.0  # linear decay over the whole run
q_lambda: 0.9
max_grad_norm: 0.5
reward_scale: 0.5  # env pays big blinds; train in big bets (2 BB)

# Shared
gamma: 1.0  # poker payoffs are undiscounted
fc_dim_size: 128

# NFSP params
anticipatory_eta: 0.1  # prob. a player follows the BR for a whole hand
sl_reservoir_capacity: 1000000  # ~all BR decisions of a 1e7-sample run
sl_batch_size: 256
sl_num_steps_per_update: 512  # 2 SL samples per env step, as in NFSP/OpenSpiel
sl_lr: 3e-4

env_name: hul
seed: 0
num_seeds: 10
env_kwargs:
  num_agents: 2
save_final: true  # see save_checkpoints in the script
save_dir: ${repo_root:}/checkpoints/HUL

# comparison: chips per hand of the average and best-response policies
compare: true
compare_mode: random  # "random" or "checkpoint"
# ReBeL opponent, from hul_rebel.py --config-name config_rebel_opponent, e.g.
# ${repo_root:}/checkpoints/HUL/hul_rebel_seed<seed>_<timestamp>.msgpack (+ .json alongside)
compare_with: ""
compare_network_type: rebel  # "rebel" (searches at test time) or "actor_critic"
compare_cfr_iters: null  # ReBeL CFR iterations per subgame when acting; null = as trained
compare_solve_chunk: 16  # ReBeL subgames solved at once per seed (GPU memory)
compare_steps: 64  # deals per evaluation, each played from both seats
compare_interval: 10

# wandb
project: bluffjax
job_type: hul_pqn_nfsp
wandb: false

# Hydra configs and logs go to outputs/ at the repo root
hydra:
  run:
    dir: ${repo_root:}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${repo_root:}/outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
