# Plain PQN in self-play (goofspiel_pqn.py) with PQN-NFSP's best-response
# settings (config_pqn_nfsp_leduc_best.yaml, the Leduc push's best PQN-NFSP),
# so the Q-learner is PQN-NFSP's without the NFSP average policy, and the
# matched-budget comparison's run settings (runs/2026-11-03_goofspiel_matched):
# 1e9 env samples (15,258 updates of 1024 envs x 64 steps), 10 seeds, exact
# exploitability every 50 updates. Every env step is one decision of each of
# the num_agents players.
num_timesteps: 1e9
num_envs: 1024
num_steps_per_env_per_update: 64
num_epochs: 4
num_minibatches: 32  # PQN-NFSP's Leduc best: more, smaller Q updates

lr: 2.5e-4
anneal_lr: true  # lr decays linearly to lr_final_frac x lr
lr_final_frac: 0.1
br_optimizer: radam  # as purejaxql
# epsilon of the epsilon-greedy policy, linear from start_e to end_e over the
# first exploration_fraction of the run
start_e: 0.06
end_e: 0.0
exploration_fraction: 1.0
q_lambda: 0.65
max_grad_norm: 10
gamma: 1.0  # undiscounted, as PQN-NFSP
fc_dim_size: 128

env_name: goofspiel
seed: 0
num_seeds: 10
env_kwargs:
  num_agents: 2
  num_cards: 6  # N; run with 4..6 (exact exploitability for N <= 6)

# Exact evaluation (two players, num_cards <= 6; else ignored): exploitability
# and exact value against random of the greedy policy, every
# exact_eval_interval updates and after the last one (0 turns it off)
exact_eval_interval: 50

# comparison: win/loss/draw rates and return of the greedy policy in
# compare_episodes games against the opponent, the learner's seat rotating
compare: true
compare_mode: random  # "random" or "checkpoint"
# checkpoint opponent: a .msgpack file, e.g. a q_network_{i}.msgpack of this
# script (compare_network_type q_network), a PPO actor_critic or an NFSP actor
compare_with: ""
compare_network_type: q_network  # "actor_critic", "q_network", or "actor"
compare_episodes: 10
compare_interval: 1

# wandb
project: bluffjax
job_type: goofspiel_pqn  # run name prefix
wandb: false

# the Q-network after half and all of the updates (half/, full/)
save_checkpoints: true
save_dir: ${repo_root:}/checkpoints/goofspiel

# Hydra configs and logs go to outputs/ at the repo root
hydra:
  run:
    dir: ${repo_root:}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${repo_root:}/outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
