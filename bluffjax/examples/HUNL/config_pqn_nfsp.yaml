# 1e8 env samples per seed (1525 updates of 1024 envs x 64 steps), 5 seeds;
# the half/ checkpoint is after 762 updates (~5e7 samples)
num_timesteps: 1e8  # the half/ checkpoint is taken after half the updates
num_envs: 1024
num_steps_per_env_per_update: 64
num_epochs: 4
num_minibatches: 4

# PQN BR params (Q-network trained on all decisions, see the script docstring)
lr: 2.5e-4
anneal_lr: true  # linear decay to 0 over all gradient steps
start_e: 1.0
end_e: 0.005
exploration_fraction: 0.1  # epsilon decays linearly over this share of the run
q_lambda: 0.9
max_grad_norm: 0.5

# Shared
gamma: 0.99
fc_dim_size: 128

# NFSP params
anticipatory_eta: 0.1  # prob. a player follows the BR for a whole hand
sl_reservoir_capacity: 1000000  # Algorithm R sample of all BR decisions
sl_batch_size: 256
sl_num_steps_per_update: 512  # 2 SL samples per env step, as in NFSP/OpenSpiel
sl_lr: 3e-4

env_name: hunl
seed: 0
num_seeds: 5
env_kwargs:
  num_agents: 2
# networks after half and all of the updates, in the run directory (see
# save_checkpoints in the script)
save_checkpoints: true
save_dir: ${repo_root:}/checkpoints/HUNL

# evaluation: the average and best-response policies each play
# compare_episodes complete hands against the opponent (each deal from both
# seats), logging avg_return (chips per hand), win_rate, loss_rate,
# draw_rate, win_rate_decided and avg_episode_length as {stat}_vs_random (or
# _vs_baseline) for the average policy and {stat}_br_vs_random for the BR
# (see run_compare_eval in the script)
compare: true
compare_mode: random  # "random" or "checkpoint"
# ReBeL opponent, from hunl_rebel.py --config-name config_rebel_opponent, e.g.
# ${repo_root:}/checkpoints/HUNL/<run>/full/value_net_0.msgpack (+ value_net_0.json alongside)
# (with compare_network_type actor_critic: a PPO-NFSP network file, e.g.
# ${repo_root:}/checkpoints/HUNL/<run>/full/avg_policy_0.msgpack)
compare_with: ""
compare_network_type: rebel  # "rebel" (searches at test time) or "actor_critic"
# ReBeL's search is expensive: one evaluation (compare_episodes 10, 64 CFR
# iterations, RTX 3080) of the 5 seeds (evaluated together) takes ~3.4 s,
# ~85 min of a 1525-update run with compare_interval 1 (~1.1 s with 2 seeds;
# against random: ~5 ms per evaluation)
compare_episodes: 10  # complete games (hands) for each policy, each deal from both seats
compare_cfr_iters: null  # ReBeL CFR iterations per subgame when acting; null = as trained
compare_solve_chunk: 16  # ReBeL subgames solved at once per seed (GPU memory)
compare_interval: 1  # updates between evaluations (and after the last)

# wandb
project: bluffjax
job_type: hunl_pqn_nfsp
wandb: false

# Hydra configs and logs go to outputs/ at the repo root
hydra:
  run:
    dir: ${repo_root:}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${repo_root:}/outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
