# ReBeL for heads-up No-Limit Hold'em (implementation: bluffjax/examples/holdem_rebel/).
#
# One sample = one value-network training example: a public belief state with
# both players' values for all 1,326 hands, from one solved subgame (a betting
# round, or the chance node between rounds). The run stops after num_samples.
num_samples: 1e7

# Self-play and search
num_games: 256  # self-play games solved in parallel
cfr_iters: 64  # Linear CFR-D iterations per subgame (each updates both players)
explore_prob: 0.25  # ReBeL's epsilon: one player explores at random
chance_flops: 256  # flops sampled per preflop chance node (0 = all 22,100)
max_raises: 2  # non-all-in raises per betting round in the search tree (all-in always allowed)
solve_chunk: 32  # subgames solved at once (bounds GPU memory)
steps_per_chunk: 8  # self-play steps per jitted call

# Value network (MLP with LayerNorm and GeLU) and its training
value_hidden_dim: 128  # 2 x 128, the network size of every baseline
value_num_layers: 2
value_lr: 3e-4
lr_halve_at: [0.5, 0.75]  # fractions of training at which the lr halves
batch_size: 512
train_ratio: 4  # trained examples per generated example
max_grad_norm: 5.0  # global-norm gradient clipping
replay_capacity: 131072  # FIFO, about 13.5 kB per example (1.8 GB) on the GPU

# Evaluation: mirrored deals (each deal played from both seats)
eval_every: 1e6  # samples
eval_deals: 128  # per opponent at each evaluation
final_eval_deals: 2048  # per opponent at the end
eval_batch_deals: 128  # deals played at once (GPU memory)
compare_with: ""  # also play this ReBeL checkpoint, e.g. ${repo_root:}/checkpoints/HUNL/<run>/full/value_net_0.msgpack (+ value_net_0.json)
# Game metrics (logged as game/<name>) of ReBeL playing itself in the env at
# every evaluation: deals, each played from both seats (whole batches of
# eval_batch_deals); 0 turns them off. 1024 deals take ~47 s per evaluation
# on an RTX 3080 (5.9 s per 128 deals with a 1e6-sample network), ~8 min per
# 1e7-sample run; binomial 95% half-widths about +-0.015 for the raise shares
# and the bluff rate, +-0.04 for all-ins called, +-0.06 for all-in call wins
metric_deals: 1024

log_every_chunks: 10
# value network after half and all of the samples, in the run directory:
# half/value_net_0.msgpack, full/value_net_0.msgpack (see holdem_rebel/train.py)
save_checkpoints: true
save_dir: ${repo_root:}/checkpoints/HUNL

env_name: hunl
seed: 0

project: bluffjax
job_type: hunl_rebel
wandb: false

# Hydra configs and logs go to outputs/ at the repo root
hydra:
  run:
    dir: ${repo_root:}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${repo_root:}/outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
