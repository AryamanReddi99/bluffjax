# 1e7 env samples per seed (152 updates of 1024 envs x 64 steps), 10 seeds
num_timesteps: 1e7
num_envs: 1024
num_steps_per_env_per_update: 64
num_epochs: 4
num_minibatches: 4

# BR (PPO), trained only on decisions made while following the BR
lr: 2.5e-4
anneal_lr: true  # linear decay to 0 over all gradient steps
gamma: 1.0  # poker payoffs are undiscounted
gae_lambda: 0.95
clip_eps: 0.2
vf_clip: 0.2
ent_coef: 0.0
vf_coef: 1.0
max_grad_norm: 0.5
reward_scale: 0.25  # env pays chips; train in units of the round-2 bet (4 chips)

# Shared network architecture
fc_dim_size: 128

# NFSP-specific knobs
anticipatory_eta: 0.1  # prob. a player follows the BR for a whole hand
sl_reservoir_capacity: 100000
sl_batch_size: 256
sl_num_steps_per_update: 512  # 2 SL samples per env step, as in NFSP/OpenSpiel
sl_lr: 3e-4

# exact exploitability of the average and BR policies every eval_interval
# updates and after the last one
eval_interval: 10

env_name: leduc_poker
seed: 0
num_seeds: 10
env_kwargs: {}

# wandb
project: bluffjax
job_type: leduc_ppo_nfsp
wandb: True

# Hydra configs and logs go to outputs/ at the repo root
hydra:
  run:
    dir: ${repo_root:}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${repo_root:}/outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
