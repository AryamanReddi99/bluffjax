# 1e8 env samples per seed (1525 updates of 1024 envs x 64 steps), 5 seeds;
# the half/ checkpoint is after 762 updates (~5e7 samples)
num_timesteps: 1e9  # best 1e9 Leduc run of the 31 Oct push (G1: 0.0535 ± 0.0022)
num_envs: 1024
num_steps_per_env_per_update: 64
num_epochs: 8
num_minibatches: 4

# BR (PPO), trained only on decisions made while following the BR
lr: 1e-3
anneal_lr: false  # constant learning rate (best in the Kuhn/Leduc sweep, 14 Oct 2026)
gamma: 1.0  # undiscounted, as in the NFSP paper
gae_lambda: 0.95
clip_eps: 0.2
vf_clip: 0.9  # 0.2 x the std of a game's return under random play (reward units)
ent_coef: 0.1  # best in the Kuhn/Leduc sweep (14 Oct 2026)
ent_coef_final: null  # set: linear decay from ent_coef to this after ent_decay_start
ent_decay_start: 0.5  # share of the updates before the entropy decay starts
vf_coef: 1.0
max_grad_norm: 0.5
target_kl: 0.015  # CleanRL-style early stop of an update's epochs

# Shared network architecture
fc_dim_size: 128

# NFSP-specific knobs
anticipatory_eta: 0.1  # prob. a player follows the BR for a whole hand
# anticipatory: each player follows the BR with prob. anticipatory_eta per hand;
# learner_seat: exactly one seat per hand (uniform) follows the BR, the other the
# average policy (BR to the average alone, about half of all decisions)
br_mode_scheme: anticipatory
sl_reservoir_capacity: 1000000  # Algorithm R sample of all BR decisions
sl_batch_size: 256
sl_num_steps_per_update: 512  # 2 SL samples per env step, as in NFSP/OpenSpiel
sl_lr: 3e-4
sl_anneal_lr: true  # SL learning rate decays linearly to 0
# reservoir target of a BR decision: sampled (the action played), greedy (argmax
# of the BR's masked logits) or sharpened (sample of softmax(logits /
# sl_target_temperature)); the BR always plays and trains on the sampled action
sl_target: sharpened  # reservoir stores softmax(logits / sl_target_temperature) samples, not the entropy-softened ones
sl_target_temperature: 0.1

# Exact evaluation of the average and BR policies, every eval_interval updates
# and after the last one: exploitability, value against random (the exact
# expected return per hand against uniformly random play, averaged over both
# seats) and the game metrics (game/, game_br/;
# bluffjax/metrics/leduc_holdem.py)
eval_interval: 3815  # exact evaluations at 0, 25, 50, 75 and 100% of training
log_br_gap: true  # also log the exact best-response gaps br_gap_* (see the script)
# Evaluation against random (*_vs_random metrics): each policy plays
# compare_episodes complete hands against uniformly random legal play, its
# position alternating between first and second to act, every compare_interval
# updates and after the last one
compare: true  # false: no evaluation against random
compare_episodes: 10  # complete hands against random, for each policy
compare_interval: 1  # updates between evaluations (and after the last)

env_name: leduc_poker
seed: 0
num_seeds: 5
env_kwargs: {}

# wandb
project: bluffjax
job_type: leduc_ppo_nfsp
wandb: false

# run directory {save_dir}/{job_type}_{timestamp}/ with config.yaml, results.jsonl
# and the average-policy and BR networks after half and all of the updates
# (half/, full/; see the script docstring)
save_checkpoints: true
save_dir: ${repo_root:}/checkpoints/leduc

# Hydra configs and logs go to outputs/ at the repo root
hydra:
  run:
    dir: ${repo_root:}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${repo_root:}/outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
