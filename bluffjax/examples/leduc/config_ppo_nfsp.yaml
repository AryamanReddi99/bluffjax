# 1e8 env samples per seed (1525 updates of 1024 envs x 64 steps), 5 seeds;
# the half/ checkpoint is after 762 updates (~5e7 samples)
num_timesteps: 1e8  # the half/ checkpoint is taken after half the updates
num_envs: 1024
num_steps_per_env_per_update: 64
num_epochs: 4
num_minibatches: 4

# BR (PPO), trained only on decisions made while following the BR
lr: 2.5e-4
anneal_lr: true  # linear decay to 0 over all gradient steps
gamma: 0.99
gae_lambda: 0.95
clip_eps: 0.2
vf_clip: 0.2
ent_coef: 0.0
vf_coef: 1.0
max_grad_norm: 0.5
reward_scale: 1.0

# Shared network architecture
fc_dim_size: 128

# NFSP-specific knobs
anticipatory_eta: 0.1  # prob. a player follows the BR for a whole hand
sl_reservoir_capacity: 1000000  # Algorithm R sample of all BR decisions
sl_batch_size: 256
sl_num_steps_per_update: 512  # 2 SL samples per env step, as in NFSP/OpenSpiel
sl_lr: 3e-4

# exact exploitability and game metrics (bluffjax/metrics/leduc_holdem.py) of
# the average and BR policies every eval_interval updates and after the last one
eval_interval: 10
compare: true
compare_episodes: 10  # complete games against random, for each policy
compare_interval: 1  # updates between evaluations (and after the last)

env_name: leduc_poker
seed: 0
num_seeds: 5
env_kwargs: {}

# wandb
project: bluffjax
job_type: leduc_ppo_nfsp
wandb: false

# run directory {save_dir}/{job_type}_{timestamp}/ with config.yaml, results.jsonl
# and the average-policy and BR networks after half and all of the updates
# (half/, full/; see the script docstring)
save_checkpoints: true
save_dir: ${repo_root:}/checkpoints/leduc

# Hydra configs and logs go to outputs/ at the repo root
hydra:
  run:
    dir: ${repo_root:}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${repo_root:}/outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
