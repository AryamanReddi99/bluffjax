# 1e8 env samples per seed (1525 updates of 1024 envs x 64 steps), 5 seeds;
# the half/ checkpoint is after 762 updates (~5e7 samples)
num_timesteps: 1e9  # best 1e9 Leduc run of the 31 Oct push (C5c: 0.0534 ± 0.0105)
num_envs: 1024
num_steps_per_env_per_update: 64
num_epochs: 4
num_minibatches: 32  # more, smaller Q updates: the main improvement

# PQN BR params (Q-network trained on all decisions, see the script docstring)
lr: 2.5e-4
anneal_lr: true  # best-response lr decays linearly to lr_final_frac x lr
lr_final_frac: 0.1  # with anneal_lr: decay linearly to lr * lr_final_frac
start_e: 0.06  # NFSP paper's epsilon
end_e: 0.0
exploration_fraction: 1.0  # epsilon decays linearly over the whole run
q_lambda: 0.65
max_grad_norm: 10  # as purejaxql
br_optimizer: radam  # as purejaxql

# Shared
gamma: 1.0  # undiscounted, as in the NFSP paper
fc_dim_size: 128

# NFSP params
anticipatory_eta: 0.1  # prob. a player follows the BR for a whole hand
sl_reservoir_capacity: 2000000  # Algorithm R sample of all BR decisions
sl_batch_size: 256
sl_num_steps_per_update: 512  # 2 SL samples per env step, as in NFSP/OpenSpiel
sl_lr: 3e-4

# Exact evaluation of the average policy and the greedy BR, every eval_interval
# updates and after the last one: exploitability, value against random (the
# exact expected return per hand against uniformly random play, averaged over
# both seats) and the game metrics (game/, game_br/;
# bluffjax/metrics/leduc_holdem.py)
eval_interval: 3815  # exact evaluations at 0, 25, 50, 75 and 100% of training
# log_br_gap: at each exact evaluation also log the exact quality of the greedy
# BR (br_value_vs_*, greedy_value_vs_*, br_gap_vs_* against the average policy
# and the per-hand NFSP mixture; bluffjax/utils/game_utils/leduc_br_gap.py)
log_br_gap: true
# Evaluation against random (*_vs_random metrics): each policy plays
# compare_episodes complete hands against uniformly random legal play, its
# position alternating between first and second to act, every compare_interval
# updates and after the last one
compare: true  # false: no evaluation against random
compare_episodes: 10  # complete hands against random, for each policy
compare_interval: 1  # updates between evaluations (and after the last)

# Env / logging
env_name: leduc_poker
seed: 0
num_seeds: 5
env_kwargs: {}

# wandb
project: bluffjax
job_type: leduc_pqn_nfsp
wandb: false

# run directory {save_dir}/{job_type}_{timestamp}/ with config.yaml, results.jsonl
# and the average-policy and BR networks after half and all of the updates
# (half/, full/; see the script docstring)
save_checkpoints: true
save_dir: ${repo_root:}/checkpoints/leduc

# Hydra configs and logs go to outputs/ at the repo root
hydra:
  run:
    dir: ${repo_root:}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${repo_root:}/outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
