# 1e7 env samples per seed (152 updates of 1024 envs x 64 steps), 10 seeds
num_timesteps: 1e7
num_envs: 1024
num_steps_per_env_per_update: 64
num_epochs: 4
num_minibatches: 4

lr: 2.5e-4
anneal_lr: true  # linear decay to 0 over all gradient steps
gamma: 1.0  # poker payoffs are undiscounted
gae_lambda: 0.95
clip_eps: 0.2
vf_clip: 0.2
ent_coef: 0.0
vf_coef: 1.0
max_grad_norm: 0.5
reward_scale: 0.25  # env pays chips; train in units of the round-2 bet (4 chips)
fc_dim_size: 128

# exact exploitability and game metrics (bluffjax/metrics/leduc_holdem.py)
# every eval_interval updates and after the last one
eval_interval: 10

env_name: leduc_poker
seed: 0
num_seeds: 10
env_kwargs: {}

# wandb
project: bluffjax
job_type: leduc_ppo
wandb: false

# run directory {save_dir}/{job_type}_{timestamp}/ with config.yaml, results.jsonl
# and the actor-critic after half and all of the updates (half/, full/; see
# the script docstring)
save_checkpoints: true
save_dir: ${repo_root:}/checkpoints/leduc

# Hydra configs and logs go to outputs/ at the repo root
hydra:
  run:
    dir: ${repo_root:}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${repo_root:}/outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
