# 1e8 env samples per seed (1525 updates of 1024 envs x 64 steps), 5 seeds;
# the half/ checkpoint is after 762 updates (~5e7 samples)
num_timesteps: 1e8  # the half/ checkpoint is taken after half the updates
num_envs: 1024
num_steps_per_env_per_update: 64
num_epochs: 4
num_minibatches: 4

lr: 2.5e-4
anneal_lr: true  # linear decay to 0 over all gradient steps
gamma: 0.99
gae_lambda: 0.95
clip_eps: 0.2
vf_clip: 0.2
ent_coef: 0.0
vf_coef: 1.0
max_grad_norm: 0.5
reward_scale: 1.0
fc_dim_size: 128

# Exact evaluation of the policy, every eval_interval updates and after the
# last one: exploitability, value against random (the exact expected return per
# hand against uniformly random play, averaged over both seats) and the game
# metrics (game/; bluffjax/metrics/leduc_holdem.py)
eval_interval: 10  # updates between exact evaluations (and after the last)
# Evaluation against random (*_vs_random metrics): the policy plays
# compare_episodes complete hands against uniformly random legal play, its
# position alternating between first and second to act, every compare_interval
# updates and after the last one
compare: true  # false: no evaluation against random
compare_episodes: 10  # complete hands against random, for each policy
compare_interval: 1  # updates between evaluations (and after the last)

env_name: leduc_poker
seed: 0
num_seeds: 5
env_kwargs: {}

# wandb
project: bluffjax
job_type: leduc_ppo
wandb: false

# run directory {save_dir}/{job_type}_{timestamp}/ with config.yaml, results.jsonl
# and the actor-critic after half and all of the updates (half/, full/; see
# the script docstring)
save_checkpoints: true
save_dir: ${repo_root:}/checkpoints/leduc

# Hydra configs and logs go to outputs/ at the repo root
hydra:
  run:
    dir: ${repo_root:}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${repo_root:}/outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
